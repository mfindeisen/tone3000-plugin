# TONE3000 Plugin - Windows build
# Builds VST3, Standalone, CLAP, and AAX (PACE-signed when secrets are
# configured), then publishes a portable ZIP and installer as a GitHub
# Release. No tests — CI is for packaging speed only.

name: Build Plugin

on:
  workflow_dispatch:

# contents: write so the job can publish a GitHub Release with the
# portable ZIP + installer. Artifact upload still uses the runtime token.
permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    environment: builds
    env:
      # Publishable key (OAuth client_id), from the "builds" environment
      # secrets. Read at CMake configure by plugin/ui/NativeUi.cmake into
      # T3kConfig.h.
      T3K_PUBLISHABLE_KEY: ${{ secrets.T3K_PUBLISHABLE_KEY }}
      # Startup update check. Sourced from the environment, not hardcoded,
      # so a clone without that secret falls back to the code default of
      # off and never pings tone3000.com.
      T3K_UPDATE_NOTICE: ${{ secrets.T3K_UPDATE_NOTICE }}
      # Compiler cache (see "Setup sccache" step below); persists compiled
      # object results across runs via the GitHub Actions cache backend.
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Single source of truth: the repo-root VERSION file (CMake and the
      # packaging scripts read it directly; CI exports it for the steps that
      # can't).
      - name: Read version
        shell: bash
        run: echo "T3K_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      # Compiler cache: reuses object-file compilation results from previous
      # runs (keyed on compiler input, not source paths), so unchanged JUCE /
      # NAM / plugin translation units are skipped on the next run instead of
      # being recompiled from scratch. Uses the GitHub Actions cache backend
      # (SCCACHE_GHA_ENABLED above), no manual actions/cache wiring needed.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # CPM (see cmake/cpm.cmake) clones JUCE / GoogleTest / clap-juce-extensions
      # into libs/ on first configure. Caching that directory means CI skips
      # the git clone whenever the pinned versions haven't changed.
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            libs/juce
            libs/googletest
            libs/clap-juce-extensions
          key: cpm-deps-windows-${{ hashFiles('CMakeLists.txt', 'plugin/CMakeLists.txt') }}

      # CMAKE_<LANG>_COMPILER_LAUNCHER (how sccache hooks in) is only honored
      # by the Makefile/Ninja generators, not the default Visual Studio
      # (MSBuild) generator, so configure passes -G Ninja. Ninja doesn't
      # auto-detect the MSVC toolchain the way the VS generator does, so set
      # up the cl.exe/link.exe dev environment explicitly first.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Steinberg's ASIO SDK (headers only), required for the ASIO driver
      # option in the standalone's audio settings. Not redistributable, so it
      # is fetched at build time rather than vendored in the repo.
      - name: Download ASIO SDK
        shell: pwsh
        run: |
          curl.exe -sSL -o asiosdk.zip https://www.steinberg.net/asiosdk
          Expand-Archive asiosdk.zip -DestinationPath "$env:RUNNER_TEMP\asiosdk"
          $sdk = (Get-ChildItem "$env:RUNNER_TEMP\asiosdk" -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$sdk\common\iasiodrv.h")) {
            Write-Error "ASIO SDK layout unexpected: iasiodrv.h not found under $sdk"
            exit 1
          }
          $sdk = $sdk -replace '\\', '/'   # forward slashes so CMake doesn't eat backslash escapes
          "ASIO_SDK_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ASIO SDK extracted to $sdk"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_AAX=ON \
            -DT3K_BUILD_UI_TESTBED=OFF \
            -DASIO_SDK_PATH="$ASIO_SDK_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      # Format targets only — skips DspTests / UI testbed compile time.
      # Installer needs VST3 + Standalone + CLAP (+ AAX when present); LV2 is
      # not shipped on Windows. bash shell so --target args are unambiguous.
      - name: Build plugin
        shell: bash
        run: |
          cmake --build build --config "${{ env.BUILD_TYPE }}" --parallel \
            --target TONE3000_VST3 \
            --target TONE3000_Standalone \
            --target TONE3000_CLAP \
            --target TONE3000_AAX

      # Windows signing uses Azure Artifact Signing. Bails out gracefully if
      # the Azure secrets are not configured; the artifacts are then unsigned.
      - name: Check Windows signing config
        id: winsign
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $enabled = if ($env:AZURE_TENANT_ID) { 'true' } else { 'false' }
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($enabled -eq 'false') {
            Write-Host "Signing secrets not configured; artifacts will be unsigned."
          }

      # PACE AAX signing is deliberately independent of the Authenticode
      # (Azure) gate above: the PACE signature is what Pro Tools checks.
      - name: Check PACE signing config
        id: pacesign
        shell: pwsh
        env:
          PACE_ILOK_ACCOUNT: ${{ secrets.PACE_ILOK_ACCOUNT }}
          PACE_TOOLS_URL_WIN: ${{ secrets.PACE_TOOLS_URL_WIN }}
        run: |
          $enabled = if ($env:PACE_ILOK_ACCOUNT -and $env:PACE_TOOLS_URL_WIN) { 'true' } else { 'false' }
          "enabled=$enabled" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($enabled -eq 'false') {
            Write-Host "PACE secrets not configured; AAX will be unsigned."
          }

      # Sign the binaries users actually run before they are packaged (the
      # .vst3 and .clap are PE DLLs, signable like any exe).
      - name: Sign binaries
        if: steps.winsign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}
          files-folder-recurse: true
          files-folder-filter: exe,vst3,clap
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # AAX must carry PACE's signature or Pro Tools refuses to load it.
      - name: Sign AAX with PACE
        if: steps.pacesign.outputs.enabled == 'true'
        shell: pwsh
        env:
          PACE_ILOK_ACCOUNT: ${{ secrets.PACE_ILOK_ACCOUNT }}
          PACE_ILOK_PASSWORD: ${{ secrets.PACE_ILOK_PASSWORD }}
          PACE_WCGUID: ${{ secrets.PACE_WCGUID }}
          PACE_TOOLS_URL: ${{ secrets.PACE_TOOLS_URL_WIN }}
          PACE_TOOLS_TOKEN: ${{ secrets.PACE_TOOLS_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          pwsh -File script/sign-aax-windows.ps1 `
            "$env:GITHUB_WORKSPACE\build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}\AAX\TONE3000.aaxplugin"

      # Build a setup.exe with Inno Setup. It ships on current windows-latest
      # images; install via choco if a future image drops it.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DVersion=$env:T3K_VERSION `
            /DArtefactsDir="$env:GITHUB_WORKSPACE\build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}" `
            /DOutputDir="$env:GITHUB_WORKSPACE\build" `
            script\installer\windows\tone3000.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: steps.winsign.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: "*.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Package the raw Standalone binary and factory presets into a portable
      # ZIP so the build can be used without Administrator rights / an installer.
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $pkgName = "TONE3000-v$env:T3K_VERSION-windows-x64-portable"
          $stageDir = "build\$pkgName"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item "build\plugin\TONE3000_artefacts\${{ env.BUILD_TYPE }}\Standalone\TONE3000.exe" -Destination "$stageDir\"

          if (Test-Path "resources\factory-presets") {
            New-Item -ItemType Directory -Force -Path "$stageDir\factory-presets" | Out-Null
            Copy-Item "resources\factory-presets\*" -Destination "$stageDir\factory-presets\"
          }

          Compress-Archive -Path "$stageDir\*" -DestinationPath "build\$pkgName.zip" -Force

      - name: Upload portable ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-windows-x64-portable
          path: build/TONE3000-v*-windows-x64-portable.zip
          if-no-files-found: error

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TONE3000-v${{ env.T3K_VERSION }}-windows-x64-installer
          path: build/TONE3000-v*-windows-x64.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Automated Build ${{ github.run_id }}
          files: |
            build/TONE3000-v*-windows-x64-portable.zip
            build/TONE3000-v*-windows-x64.exe
